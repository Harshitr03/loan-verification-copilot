[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-verification-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.25", "faker>=24", "bcrypt>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
backend = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "motor>=3.4", "beanie>=1.26,<2",
  "pydantic>=2.6", "pydantic-settings>=2.2", "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7", "pandas>=2.2", "python-multipart>=0.0.9", "anthropic>=0.39",
]
test = [
  "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "mongomock-motor>=0.0.29",
]

[tool.setuptools]
packages = ["loan_rules", "fnma_sf"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
markers = ["integration: requires a real MongoDB (LVC_TEST_MONGODB_URI)"]
filterwarnings = [
  # third-party deprecation noise (Beanie/lazy_model accessing model_fields on instances,
  # pydantic v2.11 shims). Not our code; silenced so real warnings stay visible.
  "ignore::DeprecationWarning:lazy_model.*",
  "ignore::pydantic.PydanticDeprecatedSince211",
  "ignore:.*model_fields.*:DeprecationWarning",
  "ignore:.*datetime.datetime.utcnow.*:DeprecationWarning",
]
